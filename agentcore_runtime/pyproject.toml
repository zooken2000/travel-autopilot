[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-autopilot-runtime"
version = "0.1.0"
description = "Travel Autopilot on AgentCore Runtime (Strands SDK)"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "strands-agents >= 1.15.0",
    "strands-agents-tools >= 0.2",
    "pydantic >= 2.0",
    "ddgs >= 9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
