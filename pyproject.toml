[project]
name = "travel-autopilot"
version = "0.1.0"
description = "An autonomous AI agent that quietly manages your trip and intervenes only when you need to decide."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "strands-agents>=1.0",
    "strands-agents-tools>=0.2",
    "ddgs>=9.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
